{% extends 'base.html' %}
{% block title %}Login — InternMatch{% endblock %}

{% block content %}
<div class="container-sm section">
  <div class="card card-glow">
    <div class="text-center mb-4">
      <div class="company-logo mb-2" style="margin:0 auto;">🎓</div>
      <h2>Welcome Back</h2>
      <p class="text-sm">Log in to your InternMatch account</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="name@university.edu" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">Log In →</button>
    </form>

    <div class="divider-text mt-4 mb-3">Or create a new account</div>

    <div class="grid-2">
      <a href="{{ url_for('auth.register_student') }}" class="btn btn-ghost text-center" style="justify-content: center;">
        👨🎓 Register as Student
      </a>
      <a href="{{ url_for('auth.register_company') }}" class="btn btn-ghost text-center" style="justify-content: center;">
        🏢 Register as Company
      </a>
    </div>
  </div>
</div>
{% endblock %}
