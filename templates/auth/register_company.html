{% extends 'base.html' %}
{% block title %}Company Registration — InternMatch{% endblock %}

{% block content %}
<div class="container-sm section">
  <div class="card card-glow">
    <div class="text-center mb-4">
      <span class="tag cyan mb-2">🏢 Employer Portal</span>
      <h2>Register Company</h2>
      <p class="text-sm">Connect with talented, AI-matched student candidates</p>
    </div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Company Name *</label>
        <input type="text" name="company_name" class="form-control" placeholder="ABC Technology Solutions" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Company Email *</label>
          <input type="email" name="email" class="form-control" placeholder="hr@abctech.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-control" placeholder="+251 91 123 4567">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Website URL</label>
          <input type="url" name="website" class="form-control" placeholder="https://abctech.com">
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <select name="location" class="form-control">
            <option value="">-- Select City --</option>
            <option value="Addis Ababa, Ethiopia">Addis Ababa</option>
            <option value="Adama (Nazret), Ethiopia">Adama (Nazret)</option>
            <option value="Arba Minch, Ethiopia">Arba Minch</option>
            <option value="Asella, Ethiopia">Asella</option>
            <option value="Axum, Ethiopia">Axum</option>
            <option value="Bahir Dar, Ethiopia">Bahir Dar</option>
            <option value="Bishoftu (Debre Zeit), Ethiopia">Bishoftu (Debre Zeit)</option>
            <option value="Debre Berhan, Ethiopia">Debre Berhan</option>
            <option value="Debre Markos, Ethiopia">Debre Markos</option>
            <option value="Dessie, Ethiopia">Dessie</option>
            <option value="Dilla, Ethiopia">Dilla</option>
            <option value="Dire Dawa, Ethiopia">Dire Dawa</option>
            <option value="Gondar, Ethiopia">Gondar</option>
            <option value="Harar, Ethiopia">Harar</option>
            <option value="Hawassa, Ethiopia">Hawassa</option>
            <option value="Hosaena, Ethiopia">Hosaena</option>
            <option value="Jijiga, Ethiopia">Jijiga</option>
            <option value="Jimma, Ethiopia">Jimma</option>
            <option value="Lalibela, Ethiopia">Lalibela</option>
            <option value="Mekelle, Ethiopia">Mekelle</option>
            <option value="Nekemte, Ethiopia">Nekemte</option>
            <option value="Shashamane, Ethiopia">Shashamane</option>
            <option value="Shire, Ethiopia">Shire</option>
            <option value="Sodo, Ethiopia">Sodo</option>
            <option value="Woldia, Ethiopia">Woldia</option>
            <option value="Wolaita Sodo, Ethiopia">Wolaita Sodo</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Company Overview</label>
        <textarea name="description" class="form-control" placeholder="Describe your company culture, technology stack, and what interns will learn..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-cyan btn-block btn-lg mt-4">Create Company Profile →</button>
    </form>

    <div class="text-center mt-4 text-sm">
      Already registered? <a href="{{ url_for('auth.login') }}" class="gradient-text font-medium">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
