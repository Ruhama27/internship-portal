{% extends 'base.html' %}
{% block title %}Company Profile — InternMatch{% endblock %}

{% block content %}
<div class="container-sm section">
  <div class="card card-glow">
    <div class="page-header flex-between" style="border:none; margin:0; padding-bottom: 20px;">
      <div>
        <h2>Company Profile</h2>
        <p class="text-sm">Manage your business details visible to student applicants</p>
      </div>
    </div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Company Name *</label>
        <input type="text" name="company_name" class="form-control" value="{{ company.company_name or '' }}" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Industry</label>
          <input type="text" name="industry" class="form-control" value="{{ company.industry or '' }}" placeholder="Software Development">
        </div>
        <div class="form-group">
          <label class="form-label">Contact Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ company.phone or '' }}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Website</label>
          <input type="url" name="website" class="form-control" value="{{ company.website or '' }}">
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <select name="location" class="form-control">
            <option value="">-- Select City --</option>
            {% set cities = [
              'Addis Ababa', 'Adama (Nazret)', 'Arba Minch', 'Asella', 'Axum',
              'Bahir Dar', 'Bishoftu (Debre Zeit)', 'Debre Berhan', 'Debre Markos',
              'Dessie', 'Dilla', 'Dire Dawa', 'Gondar', 'Harar', 'Hawassa',
              'Hosaena', 'Jijiga', 'Jimma', 'Lalibela', 'Mekelle', 'Nekemte',
              'Shashamane', 'Shire', 'Sodo', 'Woldia', 'Wolaita Sodo'
            ] %}
            {% for city in cities %}
              <option value="{{ city }}, Ethiopia" {% if company.location == city + ', Ethiopia' %}selected{% endif %}>{{ city }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contact Email (Where application notifications go)</label>
        <input type="email" name="contact_email" class="form-control" value="{{ company.contact_email or '' }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Company Description</label>
        <textarea name="description" class="form-control" placeholder="Describe your company culture, products, and vision...">{{ company.description or '' }}</textarea>
      </div>

      <div class="flex-between mt-4">
        <a href="{{ url_for('company.dashboard') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-cyan btn-lg">Save Profile →</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
